name: Ingress smoke test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I entrypoint.py --self-check
      - run: python3 -I dashboard.py --self-check
      - run: python3 test/smoke.py
